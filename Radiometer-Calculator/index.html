<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>מחשבון רדיומטר — שטף פוטוני</title>
<style>
  :root {
    --bg: #0b1020;
    --card: #161d33;
    --accent: #5b8cff;
    --accent2: #7c5bff;
    --text: #e8ecf6;
    --muted: #9aa4c0;
    --good: #46d39a;
    --border: #28324f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2547 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 48px;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; }
  h1 { font-size: 1.45rem; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  label { display: block; font-size: 0.9rem; color: var(--muted); margin: 14px 0 6px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  input, select {
    width: 100%;
    padding: 13px 14px;
    font-size: 1.05rem;
    background: #0e1430;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 14px;
    cursor: pointer;
  }
  button:active { transform: scale(0.985); }
  .result {
    margin-top: 22px;
    padding: 18px;
    border-radius: 14px;
    background: #0e1430;
    border: 1px solid var(--border);
    text-align: center;
    display: none;
  }
  .result.show { display: block; }
  .result .num {
    font-size: 1.7rem;
    font-weight: 800;
    color: var(--good);
    word-break: break-all;
    direction: ltr;
    margin: 4px 0;
  }
  .result .unit { color: var(--muted); font-size: 0.9rem; }
  .result .meta { color: var(--muted); font-size: 0.85rem; margin-top: 10px; line-height: 1.5; }
  .err { color: #ff7b7b; font-size: 0.88rem; margin-top: 10px; min-height: 1em; text-align: center; }
  footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 22px; line-height: 1.6; }
  code { background:#0e1430; padding:1px 5px; border-radius:5px; direction:ltr; display:inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>☢️ מחשבון רדיומטר</h1>
    <div class="sub">שטף הפוטונים הנפלט מ-1&nbsp;cm² של חומר (גוף שחור, ε&nbsp;=&nbsp;1)<br>בתחום אורכי גל נתון</div>
  </header>

  <div class="card">
    <label for="temp">טמפרטורה (קלווין, K)</label>
    <input id="temp" type="number" inputmode="decimal" value="300" min="0" step="any">

    <div class="row">
      <div>
        <label for="l1">אורך גל התחלתי</label>
        <input id="l1" type="number" inputmode="decimal" value="8" min="0" step="any">
      </div>
      <div>
        <label for="l2">אורך גל סופי</label>
        <input id="l2" type="number" inputmode="decimal" value="14" min="0" step="any">
      </div>
    </div>

    <label for="unit">יחידת אורך הגל</label>
    <select id="unit">
      <option value="1e-6">מיקרומטר (µm)</option>
      <option value="1e-9">ננומטר (nm)</option>
      <option value="1e-10">אנגסטרם (Å)</option>
      <option value="1e-3">מילימטר (mm)</option>
    </select>

    <button onclick="calculate()">חשב שטף פוטוני</button>

    <div class="err" id="err"></div>

    <div class="result" id="result">
      <div class="unit">שטף פוטוני</div>
      <div class="num" id="flux"></div>
      <div class="unit">photons / s / cm²</div>
      <div class="meta" id="meta"></div>
    </div>
  </div>

  <footer>
    מבוסס על חוק פלאנק:&nbsp;
    <code>N_λ = (2πc/λ⁴)·1/(e^(hc/λkT)−1)</code><br>
    אינטגרציה נומרית בשיטת סימפסון.
  </footer>
</div>

<script>
  // קבועי טבע (SI)
  const H = 6.62607015e-34;   // קבוע פלאנק [J·s]
  const C = 2.99792458e8;     // מהירות האור [m/s]
  const KB = 1.380649e-23;    // קבוע בולצמן [J/K]

  // שטף פוטוני ספקטרלי N_λ  [photons/s/m²/m]
  function spectralExitance(lambda, T) {
    const exponent = (H * C) / (lambda * KB * T);
    if (exponent > 700) return 0;            // הגנה מ-overflow
    return (2 * Math.PI * C) / Math.pow(lambda, 4) / (Math.exp(exponent) - 1);
  }

  // אינטגרציה בשיטת סימפסון → photons/s/cm²
  function photonFlux(T, l1, l2, n = 20000) {
    if (n % 2 === 1) n++;
    const hStep = (l2 - l1) / n;
    let total = spectralExitance(l1, T) + spectralExitance(l2, T);
    for (let i = 1; i < n; i++) {
      const x = l1 + i * hStep;
      total += (i % 2 === 1 ? 4 : 2) * spectralExitance(x, T);
    }
    const perM2 = total * hStep / 3;
    return perM2 / 1e4;   // 1 m² = 1e4 cm²
  }

  function calculate() {
    const err = document.getElementById('err');
    const resBox = document.getElementById('result');
    err.textContent = '';
    resBox.classList.remove('show');

    const T = parseFloat(document.getElementById('temp').value);
    const scale = parseFloat(document.getElementById('unit').value);
    let l1 = parseFloat(document.getElementById('l1').value) * scale;
    let l2 = parseFloat(document.getElementById('l2').value) * scale;

    if (!(T > 0)) { err.textContent = 'הטמפרטורה חייבת להיות גדולה מאפס.'; return; }
    if (!(l1 > 0) || !(l2 > 0)) { err.textContent = 'אורכי הגל חייבים להיות גדולים מאפס.'; return; }
    if (l1 === l2) { err.textContent = 'תחום אורכי הגל לא יכול להיות אפס.'; return; }
    if (l1 > l2) { [l1, l2] = [l2, l1]; }

    const flux = photonFlux(T, l1, l2);

    document.getElementById('flux').textContent = flux.toExponential(4);
    document.getElementById('meta').textContent =
      `T = ${T} K  •  ${(l1*1e9).toPrecision(4)}–${(l2*1e9).toPrecision(4)} nm`;
    resBox.classList.add('show');
  }
</script>
</body>
</html>
